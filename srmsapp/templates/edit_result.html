{% extends 'common.html' %}
{% load static %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">
        <i class="fas fa-edit text-warning"></i>
        Edit Student Result
    </h2>

    <div class="card shadow">
        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
                        {{ message }}
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <!-- Student -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student</label>
                        <select name="student" class="form-select" required>

                            {% for student in students %}
                                <option value="{{ student.id }}"
                                    {% if student.id == result.student.id %}selected{% endif %}>
                                    {{ student.first_name }} {{ student.last_name }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                    <!-- Class -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Class</label>
                        <select name="student_class" class="form-select" required>

                            {% for class in classes %}
                                <option value="{{ class.id }}"
                                    {% if class.id == result.student_class.id %}selected{% endif %}>
                                    {{ class.class_name }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                </div>

                <div class="row">

                    <!-- Subject -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Subject</label>
                        <select name="subject" class="form-select" required>

                            {% for subject in subjects %}
                                <option value="{{ subject.id }}"
                                    {% if subject.id == result.subject.id %}selected{% endif %}>
                                    {{ subject.subject_name }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                    <!-- Marks -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Marks</label>
                        <input type="number"
                               name="marks"
                               class="form-control"
                               value="{{ result.marks }}"
                               min="0"
                               max="100"
                               step="0.01"
                               required>
                    </div>

                </div>

                <button type="submit" class="btn btn-warning">
                    <i class="fas fa-save"></i>
                    Update Result
                </button>

            </form>

        </div>
    </div>

</div>

{% endblock %}
