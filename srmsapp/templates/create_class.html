{% extends 'common.html' %}
{% load static %}
{% block content %} 

<div class="container">
    <h2 class="mb-4"><i class="fas fa-plus-circle text-success"></i> Create Class</h2>
    <div class="card shadow">
        <div class="card-body">
            <form method="post" action="{% url 'create-class' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="grade" class="form-label">Grade</label>
                    <input type="text" class="form-control" id="grade" name="grade" required placeholder="Enter grade (e.g., Grade 10)">    
                </div>
                <div class="mb-3">
                    <label for="section" class="form-label">Section</label>
                    <input type="text" class="form-control" id="section" name="section" required placeholder="Enter section (e.g., Section A, B, C)">
                </div>
                <button type="submit" class="btn btn-primary">
                     <i class="fas fa-check-circle me-1"></i>Create Class
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
