{% extends 'common.html' %} {% load static %} {% block content %}

<h2 class="mb-4"><i class="fas fa-tachometer-alt"></i> Dashboard</h2>

<div class="row">
  <!-- Row 1 : 4 Cards -->

  <div class="col-md-6 col-lg-3 mb-4">
    <a href="#" class="text-decoration-none">
      <div class="card text-white bg-primary h-100 shadow">
        <div
          class="card-body d-flex justify-content-between align-items-center px-4 py-4"
        >
          <div>
            <h2 class="fw-bold mb-1">1,250</h2>
            <h6 class="mb-0">Total Students</h6>
          </div>
          <i class="fas fa-users fa-3x"></i>
        </div>
      </div>
    </a>
  </div>

  <div class="col-md-6 col-lg-3 mb-4">
    <a href="#" class="text-decoration-none">
      <div class="card text-white bg-danger h-100 shadow">
        <div
          class="card-body d-flex justify-content-between align-items-center px-4 py-4"
        >
          <div>
            <h2 class="fw-bold mb-1">45</h2>
            <h6 class="mb-0">Total Subjects</h6>
          </div>
          <i class="fas fa-book fa-3x"></i>
        </div>
      </div>
    </a>
  </div>

  <div class="col-md-6 col-lg-3 mb-4">
    <a href="#" class="text-decoration-none">
      <div class="card text-white bg-warning h-100 shadow">
        <div
          class="card-body d-flex justify-content-between align-items-center px-4 py-4"
        >
          <div>
            <h2 class="fw-bold mb-1">18</h2>
            <h6 class="mb-0">Total Classes</h6>
          </div>
          <i class="fas fa-school fa-3x"></i>
        </div>
      </div>
    </a>
  </div>

  <div class="col-md-6 col-lg-3 mb-4">
    <a href="#" class="text-decoration-none">
      <div class="card text-white bg-success h-100 shadow">
        <div
          class="card-body d-flex justify-content-between align-items-center px-4 py-4"
        >
          <div>
            <h2 class="fw-bold mb-1">980</h2>
            <h6 class="mb-0">Results Declared</h6>
          </div>
          <i class="fas fa-chart-bar fa-3x"></i>
        </div>
      </div>
    </a>
  </div>

  <!-- Row 2 : 2 Cards -->

  <div class="col-md-6 col-lg-6 mb-4">
    <a href="#" class="text-decoration-none">
      <div class="card text-white bg-info h-100 shadow">
        <div
          class="card-body d-flex justify-content-between align-items-center px-4 py-4"
        >
          <div>
            <h2 class="fw-bold mb-1">1,180</h2>
            <h6 class="mb-0">Active Students</h6>
          </div>
          <i class="fas fa-user-check fa-3x"></i>
        </div>
      </div>
    </a>
  </div>

  <div class="col-md-6 col-lg-6 mb-4">
    <a href="#" class="text-decoration-none">
      <div class="card text-white bg-secondary h-100 shadow">
        <div
          class="card-body d-flex justify-content-between align-items-center px-4 py-4"
        >
          <div>
            <h2 class="fw-bold mb-1">70</h2>
            <h6 class="mb-0">Inactive Students</h6>
          </div>
          <i class="fas fa-user-times fa-3x"></i>
        </div>
      </div>
    </a>
  </div>
</div>

<!-- Bottom Full Width Image -->

<div class="mt-2">
  <img
    src="{% static 'images/dashboard.png' %}"
    alt="SRMS Dashboard Banner"
    class="img-fluid rounded shadow w-100"
    style="height: 350px; object-fit: cover"
  />
</div>

{% endblock %}
