{% extends 'common.html' %}
{% load static %}

{% block content %}

<div class="container mt-4">
    <h2 class="mb-4">
        <i class="fas fa-edit text-success"></i>
        Edit Student
    </h2>

    <div class="card shadow">
        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show"
                         role="alert">
                        {{ message }}
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Close">
                        </button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'edit-student' student_obj.id %}">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="first_name" class="form-label">
                            First Name
                        </label>
                        <input type="text"
                               class="form-control"
                               id="first_name"
                               name="first_name"
                               value="{{ student_obj.first_name }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="last_name" class="form-label">
                            Last Name
                        </label>
                        <input type="text"
                               class="form-control"
                               id="last_name"
                               name="last_name"
                               value="{{ student_obj.last_name }}"
                               required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="gender" class="form-label">
                            Gender
                        </label>
                        <select class="form-select"
                                id="gender"
                                name="gender"
                                required>
                            <option value="">Select Gender</option>

                            <option value="male"
                                {% if student_obj.gender == 'male' %}
                                    selected
                                {% endif %}>
                                Male
                            </option>

                            <option value="female"
                                {% if student_obj.gender == 'female' %}
                                    selected
                                {% endif %}>
                                Female
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="id_number" class="form-label">
                            ID Number
                        </label>
                        <input type="text"
                               class="form-control"
                               id="id_number"
                               name="id_number"
                               value="{{ student_obj.id_number }}"
                               required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               value="{{ student_obj.email }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="dob" class="form-label">
                            Date of Birth
                        </label>
                        <input type="date"
                               class="form-control"
                               id="dob"
                               name="dob"
                               value="{{ student_obj.dob|date:'Y-m-d' }}"
                               required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="student_class" class="form-label">
                            Class
                        </label>

                        <select class="form-select"
                                id="student_class"
                                name="student_class"
                                required>

                            <option value="">
                                Select Class
                            </option>

                            {% for cls in classes %}
                                <option value="{{ cls.id }}"
                                    {% if student_obj.student_class.id == cls.id %}
                                        selected
                                    {% endif %}>
                                    {{ cls.class_name }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save me-1"></i>
                    Update Student
                </button>

                <a href="{% url 'manage-students' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>
</div>

{% endblock %}
