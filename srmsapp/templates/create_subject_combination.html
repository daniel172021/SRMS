{% extends 'common.html' %}
{% load static %}
{% block content %} 

<div class="container">
    <h2 class="mb-4"><i class="fas fa-plus-circle text-success"></i> Create Subject Combination</h2>
    <div class="card shadow">
        <div class="card-body">
        {% if messages %}   
            {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show auto-dismiss" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
            {% endfor %}
        {% endif %} 

            <form method="post" action="{% url 'create-subjectcombination' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="class" class="form-label">Select Class</label>
                    <select class="form-select" id="class" name="class" required>
                        <option value="">--- Select a class ---</option>
                        {% for cls in classes %}
                            <option value="{{ cls.id }}">{{ cls.class_name }} - {{ cls.section }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="subject" class="form-label">Select Subjects</label>
                    <select class="form-select" id="subject" name="subject" required>
                        <option value="">--- Select subjects ---</option>   
                        {% for subject in subjects %}
                            <option value="{{ subject.id }}">{{ subject.subject_name }} - {{ subject.subject_code }}</option>
                        {% endfor %}
                    </select>       
                </div>
                <button type="submit" class="btn btn-success">
                     <i class="fas fa-check-circle me-1"></i>Submit
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
