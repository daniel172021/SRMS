{% extends 'common.html' %}
{% load static %}
{% block content %} 

<div class="container">
    <h2 class="mb-4"><i class="fas fa-plus-circle text-success"></i> Create Subject</h2>
    <div class="card shadow">
        <div class="card-body">
        {% if messages %}
            {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show auto-dismiss" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
            {% endfor %}
        {% endif %} 

            <form method="post" action="{% url 'create-subject' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="subjectname" class="form-label">Subject Name</label>
                    <input type="text" class="form-control" id="subjectname" name="subjectname" required placeholder="Enter subject name (e.g., Mathematics, Science, English)">    
                </div>
                <div class="mb-3">
                    <label for="subjectcode" class="form-label">Subject Code</label>
                    <input type="text" class="form-control" id="subjectcode" name="subjectcode" required placeholder="Enter subject code (e.g., MATH101, SCI101, ENG101)">
                </div>
                <button type="submit" class="btn btn-success">
                     <i class="fas fa-check-circle me-1"></i>Submit
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
